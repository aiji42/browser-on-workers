[workspace]
# vendor/ の blitz-vibey-script を同じ Cargo.lock / target で扱う
members = ["vendor/blitz-vibey-script"]

[package]
name = "kitesurf_clone"
version = "0.1.0"
edition = "2021"

# Worker から呼ぶので cdylib。wasm-bindgen で JS の glue を作る
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Kitesurf が名前を挙げているものをそのまま使う。
# blitz-dom は Stylo (CSS) と Taffy (レイアウト) を引き込む
blitz-dom = "0.3.0-beta.2"
blitz-html = "0.3.0-beta.2"
# Viewport / ColorScheme の型が置かれているクレート (blitz-dom は再 export していない)
blitz-traits = "=0.3.0-beta.2"
# blitz-dom の DOM + レイアウト結果を anyrender の描画コマンドに落とす
blitz-paint = "0.3.0-beta.2"
# anyrender は 2D 描画の抽象。vello_cpu バックエンドが CPU だけでラスタライズする
anyrender = "0.13.0"
anyrender_vello_cpu = "0.17.0"
# Parley の FontContext / fontique の Collection にフォントを登録するため直接依存する。
# `system` feature (OS のフォントを列挙する) は wasm32 に無いので切る
parley = { version = "0.11.1", default-features = false, features = ["std"] }
# 背景を白で塗るための図形・色の型 (blitz-paint と同じバージョン)
kurbo = "0.13.1"
peniko = "0.6"
wasm-bindgen = "0.2"
# ページの <script> を Boa で実行する。crates.io には出ていない (upstream の
# workspace の中だけにある) クレートなので、vendor/ に写して使う。
# どのコミットから写したか、upstream との差は vendor/*/src/lib.rs の頭に書いてある
blitz-vibey-script = { path = "vendor/blitz-vibey-script" }
# base_url の検証 (blitz-dom が使っているのと同じクレート)
url = "2"
# wasm32 では `std::time::Instant` が動かない (panic する)。
# JS の実行に実時間の予算を付けるので、performance.now に載った Instant を使う。
# blitz-vibey-script が使っているのと同じクレート
web-time = "1"
# `<img src="data:...">` を JS を通さずに解く。usvg が既に引いているので wasm は増えない
data-url = "0.3"

# wasm32-unknown-unknown で Boa を動かすための feature。
#
# `js` は 3 つを同時に切り替える: 乱数 (`Math.random`) を getrandom の
# wasm_js バックエンドに向け、時刻を `performance.now` / `Date.now` に向け、
# `time` クレートをブラウザ時計に向ける。これが無いと getrandom が
# 「wasm32-unknown-unknown は既定では非対応」でビルドを止める。
#
# blitz-vibey-script は boa を default feature で引いているので、ここで
# feature を足すだけでよい (cargo は feature を足し合わせる)
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "0.22", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# wasm32-unknown-unknown は target 自体が unwind 非対応なので、ここは abort 固定で
# 変えても意味が無い。panic の中身は lib.rs の panic hook が JS の例外にして届ける。
# strip でシンボル名 (custom:name セクション、約 4MB) を落とす
panic = "abort"
strip = true

# blitz-vibey-script は crates.io に出ていない (upstream の workspace 内だけ) ので、
# blitz 本体も同じコミットに合わせる。0.3.0-beta.2 の release から 20 コミットぶんの差
[patch.crates-io]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "4507cd7" }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "4507cd7" }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "4507cd7" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "4507cd7" }
